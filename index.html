<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHC · HR Dashboard</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
:root{
  color-scheme: light;
  --brand:#5b2bee;
  --surface-0:#f4f4f2; --surface-1:#fcfcfb; --surface-2:#f7f7f5;
  --border:#e2e1dc; --border-strong:#cfcec8;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#7a7975;
  --grid:#eceae5;
  --s1:#2a78d6; --s2:#eb6834;
  --line:#4a3aa7; --line-fill:rgba(74,58,167,.14);
  --pos:#2a78d6; --neg:#e34948; --neutral:#e6e5e1;
  --seq-1:#cde2fb; --seq-2:#9ec5f4; --seq-3:#6da7ec; --seq-4:#3987e5; --seq-5:#256abf; --seq-6:#184f95;
  --holiday:#efe7c8; --holiday-ink:#7a6410;
  --shadow:0 1px 2px rgba(11,11,11,.05),0 8px 24px rgba(11,11,11,.06);
  --radius:14px;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --brand:#9d80ff;
  --surface-0:#111110; --surface-1:#1a1a19; --surface-2:#222220;
  --border:#33332f; --border-strong:#45443f;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#96958c;
  --grid:#2b2b28;
  --s1:#3987e5; --s2:#d95926;
  --line:#9085e9; --line-fill:rgba(144,133,233,.18);
  --pos:#3987e5; --neg:#e66767; --neutral:#33332f;
  --seq-1:#184f95; --seq-2:#256abf; --seq-3:#2a78d6; --seq-4:#3987e5; --seq-5:#6da7ec; --seq-6:#9ec5f4;
  --holiday:#3a3320; --holiday-ink:#e0cd8a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body,input,select,button,textarea,table,svg text{
  font-family:"Pretendard Variable",Pretendard,"Pretendard JP",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
html,body{margin:0;padding:0}
body{background:var(--surface-0); color:var(--text-primary);
  font-feature-settings:"tnum" 1; -webkit-font-smoothing:antialiased;}
.num,.dt-date,td,th,.kpi .v{font-variant-numeric:tabular-nums}

/* ---------- LOGIN ---------- */
#gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,#2c1470 0%,#5b2bee 45%,#7d5cff 100%);padding:24px}
#gate::after{content:"";position:absolute;inset:0;background:
  radial-gradient(700px 420px at 12% 12%,rgba(255,255,255,.16),transparent 60%),
  radial-gradient(600px 400px at 88% 88%,rgba(255,255,255,.10),transparent 60%)}
.gate-card{position:relative;z-index:1;width:100%;max-width:396px;background:var(--surface-1);
  border-radius:20px;padding:36px 34px 28px;box-shadow:0 24px 60px rgba(20,6,60,.45)}
.gate-logo{display:flex;justify-content:center;margin-bottom:24px}
.gate-logo img{height:40px;width:auto;display:block}
.brandbox img.logo{height:29px;width:auto;display:block}
:root[data-theme="dark"] .brandbox img.logo{filter:brightness(1.55) saturate(.92)}
.gate-card h1{font-size:19.5px;font-weight:800;margin:0 0 6px;letter-spacing:-.02em;text-align:center}
.gate-card p{margin:0 0 20px;font-size:13.5px;color:var(--text-secondary);text-align:center;line-height:1.55}
.field{position:relative;margin-bottom:12px}
.field input{width:100%;padding:13px 44px 13px 14px;font-size:15px;border-radius:11px;
  border:1.5px solid var(--border-strong);background:var(--surface-2);color:var(--text-primary);outline:none}
.field input:focus{border-color:var(--brand);box-shadow:0 0 0 3.5px color-mix(in srgb,var(--brand) 18%,transparent)}
.field button.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;
  cursor:pointer;padding:8px;color:var(--text-muted);line-height:0}
.btn{width:100%;padding:13px;border:0;border-radius:11px;background:var(--brand);color:#fff;
  font-size:15px;font-weight:700;cursor:pointer;letter-spacing:-.01em}
.btn:hover{filter:brightness(1.07)}
.gate-err{display:none;margin-top:11px;font-size:13px;color:#e34948;text-align:center;font-weight:600}
.gate-err.show{display:block}
.gate-lang{display:flex;justify-content:center;gap:5px;margin-top:18px}
.gate-lang button{border:1px solid var(--border);background:var(--surface-2);color:var(--text-secondary);
  font-size:12px;font-weight:650;padding:5px 11px;border-radius:999px;cursor:pointer}
.gate-lang button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.gate-foot{margin-top:16px;font-size:11.5px;color:var(--text-muted);text-align:center}
.shake{animation:sh .38s}
@keyframes sh{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* ---------- APP ---------- */
#app{display:none;max-width:1360px;margin:0 auto;padding:22px 22px 60px}
#app.on{display:block}
header.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.brandbox{display:flex;align-items:center;gap:14px;color:var(--brand)}
.brandbox .t1{font-size:17px;font-weight:800;letter-spacing:-.025em;line-height:1.15;white-space:nowrap;color:var(--text-primary)}
.brandbox .t2{font-size:12.5px;color:var(--text-secondary);margin-top:3px;white-space:nowrap}
@media(max-width:680px){.brandbox .t1,.brandbox .t2{white-space:normal}}
.spacer{flex:1}
.ghost{border:1px solid var(--border);background:var(--surface-1);color:var(--text-secondary);
  border-radius:10px;padding:8px 13px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.ghost:hover{border-color:var(--border-strong);color:var(--text-primary)}
.ghost.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.ghost.primary:hover{filter:brightness(1.08);color:#fff}

.controls{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:18px;display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end;box-shadow:var(--shadow)}
.ctl-label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface-2);color:var(--text-secondary);
  padding:7px 13px;border-radius:999px;font-size:13px;font-weight:650;cursor:pointer;position:relative}
.chip:hover{border-color:var(--border-strong)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.empty::after{content:"";position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--text-muted);opacity:.55}
.chip[aria-pressed="true"].empty::after{background:#fff;opacity:.7}
select.sel{font-size:13px;font-weight:600;padding:7px 11px;border-radius:9px;
  border:1px solid var(--border);background:var(--surface-2);color:var(--text-primary)}
.rowsel{display:flex;gap:8px;align-items:center}
.rowsel span{color:var(--text-muted);font-size:13px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px 14px;box-shadow:var(--shadow)}
.kpi .k{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted)}
.kpi .v{font-size:31px;font-weight:800;letter-spacing:-.035em;margin-top:7px;line-height:1}
.kpi .s{font-size:12px;color:var(--text-secondary);margin-top:7px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px}
.tag.up{background:color-mix(in srgb,var(--s1) 15%,transparent);color:var(--s1)}
.tag.down{background:color-mix(in srgb,var(--s2) 15%,transparent);color:var(--s2)}
.tag.flat{background:var(--surface-2);color:var(--text-muted)}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
@media(max-width:900px){.g2{grid-template-columns:1fr}}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);
  padding:17px 18px 14px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{font-size:15.5px;font-weight:750;margin:0;letter-spacing:-.02em}
.card .sub{font-size:12.5px;color:var(--text-secondary);margin-top:4px;line-height:1.45}
.card-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.card-head .spacer{flex:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--text-secondary)}
.sw{width:11px;height:11px;border-radius:3px;flex:none}
figure{margin:0}
figcaption{font-size:11.5px;color:var(--text-muted);margin-top:9px;line-height:1.55}
svg{display:block;width:100%;overflow:visible}
.tick{font-size:11px;fill:var(--text-muted)}
.axis-line{stroke:var(--border-strong);stroke-width:1}
.gl{stroke:var(--grid);stroke-width:1}
.dlabel{font-size:11px;font-weight:700;fill:var(--text-secondary)}

.tt{position:fixed;z-index:60;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--surface-1);border:1px solid var(--border-strong);border-radius:10px;padding:9px 11px;
  box-shadow:0 8px 26px rgba(0,0,0,.16);font-size:12.5px;min-width:160px;max-width:300px}
.tt.on{opacity:1}
.tt .tt-d{font-weight:750;font-size:12.5px;margin-bottom:6px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tt .tr{display:flex;align-items:center;gap:7px;margin-top:3px;color:var(--text-secondary)}
.tt .tr b{margin-left:auto;color:var(--text-primary);font-weight:750;padding-left:10px}
.tt .tt-note{margin-top:7px;padding-top:6px;border-top:1px solid var(--border);font-size:12px;color:var(--text-secondary);line-height:1.4}

table.dt{width:100%;min-width:660px;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px}
table.dt th{text-align:left;font-weight:700;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-muted);padding:11px 16px;border-bottom:1px solid var(--border-strong);
  position:sticky;top:0;z-index:2;background:var(--surface-1);white-space:nowrap}
table.dt td{padding:0 16px;height:44px;border-bottom:1px solid var(--border);color:var(--text-secondary);vertical-align:middle}
table.dt tbody tr:last-child td{border-bottom:0}
table.dt td.dt-date{color:var(--text-primary);font-weight:650;white-space:nowrap;
  font-variant-numeric:tabular-nums;letter-spacing:.01em}
table.dt td.dt-type{white-space:nowrap}
table.dt td.dt-num,table.dt th.thr{text-align:center}
table.dt td.dt-num{color:var(--text-primary);font-weight:700}
table.dt td.dt-note{color:var(--text-secondary);line-height:1.45;padding-top:11px;padding-bottom:11px;
  white-space:normal;overflow-wrap:anywhere}
table.dt tbody tr:hover td{background:var(--surface-2)}
.scroll{max-height:440px;overflow:auto;border:1px solid var(--border);border-radius:11px;scrollbar-gutter:stable}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge.in{background:color-mix(in srgb,var(--s1) 14%,transparent);color:var(--s1)}
.badge.out{background:color-mix(in srgb,var(--s2) 15%,transparent);color:var(--s2)}
.badge.hol{background:var(--holiday);color:var(--holiday-ink)}
.badge.note{background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border)}
.empty-state{padding:46px 20px;text-align:center;color:var(--text-muted);font-size:13.5px;line-height:1.65}
.empty-state .es-t{display:block;color:var(--text-primary);font-size:16px;font-weight:750;margin-bottom:8px;letter-spacing:-.02em}
.empty-state .wrap{display:block;max-width:560px;margin:0 auto}
.empty-state b{color:var(--text-secondary);font-weight:700}
.cal-month{margin-bottom:10px}
.cal-name{font-size:11.5px;font-weight:700;color:var(--text-secondary);margin-bottom:5px}
#modal{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;
  background:rgba(11,11,11,.55);padding:24px;backdrop-filter:blur(2px)}
#modal.on{display:flex}
.mbox{background:var(--surface-1);border:1px solid var(--border);border-radius:16px;width:100%;max-width:620px;
  box-shadow:0 30px 70px rgba(0,0,0,.35);overflow:hidden}
.mhead{padding:20px 24px 14px}
.mhead h3{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em}
.mhead p{margin:6px 0 0;font-size:13px;color:var(--text-secondary);line-height:1.5;overflow-wrap:anywhere}
.mbody{padding:0 24px 6px}
table.cmp{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;table-layout:fixed}
table.cmp col.c1{width:34%}table.cmp col.c2{width:33%}table.cmp col.c3{width:33%}
.mnote{font-size:11.5px;color:var(--text-muted);margin:10px 2px 0;line-height:1.5}
table.cmp th{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);
  padding:9px 12px;text-align:left;border-bottom:1px solid var(--border-strong)}
table.cmp td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text-secondary);
  vertical-align:top;line-height:1.45;overflow-wrap:anywhere}
table.cmp td.lbl{color:var(--text-primary);font-weight:650}
table.cmp td.aft{color:var(--text-primary);font-weight:700}
table.cmp td.aft.chg{color:var(--brand)}
table.cmp tr:last-child td{border-bottom:0}
.mfoot{display:flex;gap:10px;justify-content:flex-end;padding:16px 24px 20px}
.mfoot button{border-radius:10px;padding:10px 20px;font-size:13.5px;font-weight:700;cursor:pointer;border:1px solid var(--border-strong);
  background:var(--surface-2);color:var(--text-secondary)}
.mfoot button.ok{background:var(--brand);border-color:var(--brand);color:#fff}
.mfoot button:hover{filter:brightness(1.06)}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:90;opacity:0;
  transition:.2s;background:var(--text-primary);color:var(--surface-1);padding:12px 18px;border-radius:11px;
  font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:min(560px,90vw);line-height:1.5}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.err{background:#e34948;color:#fff}
@media print{#app{padding:0}.ghost,.controls{display:none}.card{break-inside:avoid;box-shadow:none}}
</style>
</head>

async function sha256(s){
  const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

  }

function niceTicks(lo,hi,n){
  const span=hi-lo||1, raw=span/n, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw)||mag*10;
  const out=[]; for(let v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step) out.push(Math.round(v*100)/100);
  return out;
}

let YEAR=Object.keys(DATASETS).sort().pop(), ENT='SHI', M0=0, M1=11;

function indexEvents(){
  eventsByDate={}; holidaySet=new Set();
  D().events.forEach(e=>{(eventsByDate[e.date] ||= []).push(e); if(e.type==='holiday')holidaySet.add(e.date);});
}
function entHasData(name){const s=D().series[name]; return !!s && s.total.some(v=>has(v));}
function monthsAvail(){return [...new Set(D().dates.map(d=>+d.slice(5,7)-1))].sort((a,b)=>a-b);}
function slice(){
  const out=[], s=D().series[ENT];
  if(!s) return out;
  D().dates.forEach((ds,i)=>{
    const m=+ds.slice(5,7)-1; if(m<M0||m>M1)return;
    const parts={}; for(const k in s.parts) parts[k]=s.parts[k][i];
    out.push({date:ds,i,m,v:s.total[i],parts});
  });
  return out;
}

  if(!fi.__bound){ fi.__bound=1;
    const go=()=>{ const f=fi.files&&fi.files[0]; if(!f||fi.__busy) return; fi.__busy=1;
      importXlsx(f).finally(()=>{ fi.__busy=0; fi.value=''; }); };
    fi.addEventListener('change',go); fi.addEventListener('input',go);
  }
  addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(paint,180);});

/* ---- KPI ---- */
function kpiRow(valid){
  const t=T(), first=valid[0], last=valid[valid.length-1], net=last.v-first.v;
  const evs=D().events.filter(e=>{const m=+e.date.slice(5,7)-1;return m>=M0&&m<=M1;});
  const masuk=evs.filter(e=>e.type==='in').reduce((a,b)=>a+b.count,0);
  const keluar=evs.filter(e=>e.type==='out').reduce((a,b)=>a+b.count,0);
  const vals=valid.map(r=>r.v), avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  let chg=0; for(let i=1;i<valid.length;i++) if(valid[i].v!==valid[i-1].v) chg++;
  const showFlow = evs.some(e=>e.type==='in'||e.type==='out');
  const box=el('div',{class:'kpis'});
  const card=(k,v,s)=>el('div',{class:'kpi'},el('div',{class:'k'},k),el('div',{class:'v'},v),el('div',{class:'s',html:s}));
  const tag=n=>n>0?`<span class="tag up">▲ +${n}</span>`:n<0?`<span class="tag down">▼ ${n}</span>`:`<span class="tag flat">${t.tagFlat}</span>`;
  box.appendChild(card(t.kHead,String(last.v),t.kHeadSub(dLabel(last.date))));
  box.appendChild(card(t.kChange,(net>0?'+':'')+net,tag(net)+' '+t.kChangeSub(first.v,dShort(first.date))));
  if(showFlow){
    box.appendChild(card(t.kIn,String(masuk),`<span class="tag up">▲ ${t.tagIn}</span> `+t.kInSub(evs.filter(e=>e.type==='in').length)));
    box.appendChild(card(t.kOut,String(keluar),`<span class="tag down">▼ ${t.tagOut}</span> `+t.kOutSub(evs.filter(e=>e.type==='out').length)));
  }
  box.appendChild(card(t.kAvg,dec(avg),t.kAvgSub(Math.min(...vals),Math.max(...vals))));
  box.appendChild(card(t.kDays,String(chg),t.kDaysSub(valid.length)));
  return box;
}

function chartHeadcount(rows,valid){

    el('div',{},el('h2',{},t.c1(ENT)),el('div',{class:'sub'},t.c1sub)),

      el('span',{class:'lg'},el('span',{class:'sw',style:'background:var(--holiday)'}),t.c1hol))));

  const W=960,H=330,PL=46,PR=18,PT=16,PB=40,w=W-PL-PR,h=H-PT-PB;
  const vals=valid.map(r=>r.v);
  let lo=Math.min(...vals), hi=Math.max(...vals);
  const p=Math.max(2,Math.round((hi-lo)*0.35)); lo=Math.max(0,lo-p); hi=hi+p;
  const X=i=>PL+(rows.length<2?w/2:i*w/(rows.length-1));
  const Y=v=>PT+h-(v-lo)/(hi-lo||1)*h;
  const svg=S('svg',{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:'none',style:'height:330px',role:'img','aria-label':t.c1(ENT)});

  const firstI=valid[0].i, lastI=valid[valid.length-1].i;

    off+=46+fnl+efl+fcl;
  }
  for(const k in out){ if(out[k].data===null) out[k].data=await inflateRaw(out[k].raw); }
  const res={}; for(const k in out) res[k]=td.decode(out[k].data);
  return res;
}
const colIdx=r=>{let s=r.match(/^[A-Z]+/)[0],n=0;for(const c of s)n=n*26+(c.charCodeAt(0)-64);return n;};
const rowIdx=r=>+r.match(/\d+$/)[0];
const serialToISO=v=>{const ms=Math.round((v-25569)*86400000);const d=new Date(ms);
  return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}-${pad2(d.getUTCDate())}`;};

const RE_IN=/(new employee|new expat|new staff|new local|joined|karyawan baru|pegawai baru|입사|신규\s*입사|채용|^new\s(?!year)|^\d+\s+new\s)/;
const RE_OUT=/(resign|(?:end|and)\s+of\s+contract|contract\s+end|terminat|keluar|berhenti|mengundurkan|퇴사|계약\s*종료|해지)/;
const RE_HOL=/(national holiday|public holiday|holiday|libur|cuti bersama|collective leave|celebration|commemoration|independence|labor day|labour day|pancasila|ascension|good friday|easter|christmas|new year|eid|idul|nyepi|isra|mi'?raj|prophet|vesak|waisak|ramadan|공휴일|휴일|명절)/;
function classify(text){
  const l=text.toLowerCase();
  const mi=l.search(RE_IN), mo=l.search(RE_OUT);
  if(mi>=0 && (mo<0 || mi<mo)) return 'in';
  if(mo>=0) return 'out';
  if(RE_HOL.test(l)) return 'holiday';
  return 'note';
}
function countOf(text,type){
  if(type==='holiday') return 0;
  let m=text.match(/\((\d+)\)/); if(m) return +m[1];
  m=text.match(/^(\d+)\s/); if(m) return +m[1];
  const mr=(text.match(/Mr\./g)||[]).length; if(type==='in'&&mr>1) return mr;
  m=text.match(/(\d+)\s*(orang|people|persons?|명)/i); if(m) return +m[1];
  return 1;
}

function parseSheet(xml, shared, commentsXml){
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  const cells={};
  doc.querySelectorAll('sheetData row').forEach(row=>{
    row.querySelectorAll('c').forEach(c=>{
      const r=c.getAttribute('r'); if(!r) return;
      const ty=c.getAttribute('t'), v=c.querySelector('v'), is=c.querySelector('is t');
      let val=null;
      if(ty==='s' && v) val=shared[+v.textContent]??'';
      else if(ty==='inlineStr'||ty==='str') val=(is?is.textContent:(v?v.textContent:''));
      else if(v) val=parseFloat(v.textContent);
      cells[r]=val;
    });
  });
  const get=(r,c)=>{const L=(()=>{let s='',n=c;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26;}return s;})();
    return cells[L+r];};
  // date row: find the row (1..6) with the most numeric date-like values in col>=3
  let dateRow=-1, best=0;
  for(let r=1;r<=8;r++){
    let n=0; for(let c=3;c<=800;c++){const v=get(r,c); if(typeof v==='number'&&v>40000&&v<80000)n++;}
    if(n>best){best=n;dateRow=r;}
  }
  if(best<20) return null;
  const dates=[], cols=[];
  for(let c=3;c<=1200;c++){const v=get(dateRow,c);
    if(typeof v==='number'&&v>40000&&v<80000){dates.push(serialToISO(v));cols.push(c);}}
  // labels in col B
  const labels={};
  for(let r=1;r<=80;r++){const v=get(r,2); if(typeof v==='string'&&v.trim())labels[r]=v.trim();}
  const ENTS=['SHG+CSTG','SHG','SHC','SHV','SHI','CSTG','CSTC','CSTV','CSTI'];
  const PARTS=['Direct','Indirect','OH','EXP','KOREAN'];
  const entRow={}, entParts={};
  Object.keys(labels).map(Number).sort((a,b)=>a-b).forEach(r=>{
    const L=labels[r];
    if(ENTS.includes(L) && entRow[L]===undefined){entRow[L]=r; entParts[L]={};}
  });
  Object.keys(entRow).forEach(E=>{
    let r=entRow[E]+1;
    while(labels[r] && PARTS.includes(labels[r])){ entParts[E][labels[r]]=r; r++; }
  });
  if(!Object.keys(entRow).length) return null;
  const series={};
  ENTS.forEach(E=>{ if(entRow[E]===undefined) return;
    const o={total:[],parts:{}};
    Object.keys(entParts[E]).forEach(k=>o.parts[k]=[]);
    cols.forEach(c=>{
      const v=get(entRow[E],c); o.total.push(typeof v==='number'?v:null);
      Object.keys(entParts[E]).forEach(k=>{const v2=get(entParts[E][k],c); o.parts[k].push(typeof v2==='number'?v2:null);});
    });
    series[E]=o;
  });
  // comments
  const events=[];
  if(commentsXml){
    const cd=new DOMParser().parseFromString(commentsXml,'application/xml');
    const owner={}; Object.keys(entRow).forEach(E=>{owner[entRow[E]]=E;
      Object.values(entParts[E]).forEach(r=>owner[r]=E);});
    cd.querySelectorAll('commentList > comment').forEach(cm=>{
      const ref=cm.getAttribute('ref'); if(!ref) return;
      const ci=colIdx(ref), ri=rowIdx(ref), di=cols.indexOf(ci);
      if(di<0) return;
      let txt=[...cm.querySelectorAll('text t')].map(x=>x.textContent).join('');
      let lines=txt.split('\n').map(s=>s.trim()).filter(Boolean);
      if(lines.length && /:$/.test(lines[0])) lines=lines.slice(1);
      const text=lines.join(' ').trim(); if(!text) return;
      const type=classify(text);
      events.push({date:dates[di],type,text,count:countOf(text,type),entity:owner[ri]||''});
    });
  }
  events.sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:(a.type<b.type?-1:1));
  return {dates,series,events};
}

function summarize(sets, ent){
  const years=Object.keys(sets).sort();
  if(!years.length) return null;
  const y=years[years.length-1], d=sets[y];
  const sr=d.series[ent]||d.series['SHI']||Object.values(d.series)[0];
  const idx=[]; if(sr) d.dates.forEach((ds,i)=>{ if(has(sr.total[i])) idx.push(i); });
  return {years, y, from:d.dates[0], to:d.dates[d.dates.length-1], days:idx.length,
    events:d.events.length, last:idx.length?sr.total[idx[idx.length-1]]:null,
    lastDate:idx.length?d.dates[idx[idx.length-1]]:null};
}
function confirmImport(file, before, after){
  return new Promise(res=>{
    const t=T(), m=document.getElementById('modal');
    document.getElementById('mTitle').textContent=t.cfTitle;
    document.getElementById('mSub').innerHTML=t.cfSub(file.name);
    document.getElementById('mCancel').textContent=t.cfCancel;
    document.getElementById('mOk').textContent=t.cfOk;
    const fmtP=x=>x?`${dLabel(x.from).replace(/^[^,]+,\s*/,'')} – ${dLabel(x.to).replace(/^[^,]+,\s*/,'')}`:'–';
    const fmtL=x=>x&&x.last!=null?`${x.last} (${dLabel(x.lastDate).replace(/^[^,]+,\s*/,'')})`:'–';
    const rows=[
      [t.cfYears, before?before.years.join(', '):t.cfNone, after.years.join(', ')],
      [t.cfPeriod, before?fmtP(before):'–', fmtP(after)],
      [`${t.cfLast} · ${ENT}`, before?fmtL(before):'–', fmtL(after)],
      [t.cfDays, before?String(before.days):'–', String(after.days)],
      [t.cfEvents, before?String(before.events):'–', String(after.events)]
    ];
    document.getElementById('mBody').innerHTML=
      '<table class="cmp"><colgroup><col class="c1"><col class="c2"><col class="c3"></colgroup><thead><tr>'+
      `<th>${t.cfItem}</th><th>${t.cfBefore}</th><th>${t.cfAfter}</th></tr></thead><tbody>`+
      rows.map(r=>`<tr><td class="lbl">${r[0]}</td><td>${r[1]}</td>`+
        `<td class="aft${r[1]!==r[2]?' chg':''}">${r[2]}</td></tr>`).join('')+
      '</tbody></table>'+`<div class="mnote">${t.cfNote(before?before.y:t.cfNone, after.y)}</div>`;
    m.classList.add('on');
    const done=v=>{ m.classList.remove('on');
      document.getElementById('mOk').onclick=null; document.getElementById('mCancel').onclick=null;
      m.onclick=null; document.removeEventListener('keydown',key); res(v); };
    const key=e=>{ if(e.key==='Escape') done(false); if(e.key==='Enter') done(true); };
    document.getElementById('mOk').onclick=()=>done(true);
    document.getElementById('mCancel').onclick=()=>done(false);
    m.onclick=e=>{ if(e.target===m) done(false); };
    document.addEventListener('keydown',key);
    document.getElementById('mOk').focus();
  });
}

async function importXlsx(file){
  toast(T().impWait);
  try{
    const z=await unzip(await file.arrayBuffer());
    const shared=[];
    if(z['xl/sharedStrings.xml']){
      const sd=new DOMParser().parseFromString(z['xl/sharedStrings.xml'],'application/xml');
      sd.querySelectorAll('sst > si').forEach(si=>shared.push([...si.querySelectorAll('t')].map(t=>t.textContent).join('')));
    }
    const wb=new DOMParser().parseFromString(z['xl/workbook.xml'],'application/xml');
    const rels=new DOMParser().parseFromString(z['xl/_rels/workbook.xml.rels'],'application/xml');
    const relMap={}; rels.querySelectorAll('Relationship').forEach(r=>relMap[r.getAttribute('Id')]=r.getAttribute('Target').replace(/^\/?xl\//,'').replace(/^\.\.\//,''));
    const found={}, names=[];
    for(const sh of wb.querySelectorAll('sheets > sheet')){
      const nm=sh.getAttribute('name');
      const rid=sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
      const target=relMap[rid]; if(!target) continue;
      const path='xl/'+target; const xml=z[path]; if(!xml) continue;
      let cxml=null;
      const rp='xl/'+target.replace(/([^/]+)$/,'_rels/$1.rels');
      if(z[rp]){
        const rr=new DOMParser().parseFromString(z[rp],'application/xml');
        for(const r of rr.querySelectorAll('Relationship')){
          const tg=r.getAttribute('Target')||'';
          if(/comments\d*\.xml$/.test(tg)){ const cp='xl/'+tg.replace(/^\.\.\//,''); if(z[cp]) cxml=z[cp]; }
        }
      }
      const parsed=parseSheet(xml, shared, cxml);
      if(parsed && parsed.dates.length){ parsed.file=file.name; found[nm]=parsed; names.push(nm); }
    }
    if(!names.length){ toast(T().impNone,true); return; }
    const ordered=[...names].sort();
    const before=summarize(DATASETS,ENT), after=summarize(found,ENT);
    document.getElementById('toast').className='';
    const okGo=await confirmImport(file, before, after);
    if(!okGo){ toast(T().impCancel); return; }
    Object.keys(DATASETS).forEach(k=>delete DATASETS[k]);
    ordered.forEach(n=>DATASETS[n]=found[n]);
    YEAR=ordered[ordered.length-1];
    indexEvents();
    if(!D().series[ENT]) ENT = D().series['SHI']?'SHI':Object.keys(D().series)[0];
    const av=monthsAvail(); M0=av[0]; M1=av[av.length-1];
    buildControls(); paint();
    toast(T().impOk(file.name,ordered.length,ordered.join(', ')));
  }catch(err){ console.error(err); toast(T().impErr(err.message||err),true); }
}
